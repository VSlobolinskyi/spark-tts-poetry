[tool.poetry]
name = "spark-tts-poetry"
version = "0.1.0"
description = "A text-to-speech project by SparkAudio."
authors = ["vitalii.slobolinskyi"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/VSlobolinskyi/spark-tts-poetry"
repository = "https://github.com/VSlobolinskyi/spark-tts-poetry"

[[tool.poetry.packages]]
include = "scripts"

[tool.poetry.dependencies]
python = ">=3.10,<3.11"
einops = "0.8.1"
einx = "0.3.0"
numpy = "*"
omegaconf = "2.3.0"
packaging = "24.2"
safetensors = "0.5.2"
soundfile = "0.12.1"
soxr = "0.5.0.post1"
torch = "^2.7.1"
torchaudio = "^2.7.1"
tqdm = "4.66.5"
transformers = "4.51.0"
gradio = "5.18.0"
tensorrt = {url = "https://pypi.nvidia.com/tensorrt/tensorrt-10.11.0.33.tar.gz#sha256=a3d6048f86e11ea5202d473646194d3be866c0c8d578ac0b7eeb91d923f65d0b"}
tensorrt-llm = {url = "https://pypi.nvidia.com/tensorrt-llm/tensorrt_llm-0.19.0-cp310-cp310-linux_x86_64.whl#sha256=a75031e3f1bd44cdffe0ab4429e798ce5761a49361241afa6eea2174dd8ea7a9"}
cuda-python = {version=">=12.0,<13", markers="python_version >= '3.10' and python_version < '3.11'"}
tritonclient = {version=">=2.55,<2.61", extras=["grpc","http"]}

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
download-model = "scripts.download_model:main"