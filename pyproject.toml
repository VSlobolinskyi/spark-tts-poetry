[tool.poetry]
name = "spark-tts-poetry"
version = "0.1.0"
description = "A text-to-speech project by SparkAudio."
authors = ["vitalii.slobolinskyi"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/VSlobolinskyi/spark-tts-poetry"
repository = "https://github.com/VSlobolinskyi/spark-tts-poetry"

[[tool.poetry.packages]]
include = "scripts_poetry"

[tool.poetry.dependencies]
python = ">=3.12,<4"
einops = "0.8.1"
einx = "0.3.0"
numpy = "2.2.3"
omegaconf = "2.3.0"
packaging = "24.2"
safetensors = "0.5.2"
soundfile = "0.12.1"
soxr = "0.5.0.post1"
torch = "2.5.1"
torchaudio = "2.5.1"
tqdm = "4.66.5"
transformers = "4.46.2"
gradio = "5.18.0"

nvidia-pyindex = "*"
tensorrt = {url = "https://pypi.nvidia.com/tensorrt/tensorrt-10.13.2.6.tar.gz#sha256=9a2ab4e5661e2ba8294a79a07efe09e2ce981a5469213fe309e0bdad79a22511"}
tensorrt-llm = {url = "https://pypi.nvidia.com/tensorrt-llm/tensorrt_llm-1.1.0rc1-cp312-cp312-linux_x86_64.whl#sha256=ddfb965116c85e132ded95018c9e35089869003afd35bacb7d884a528e3264d8"}

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
download-model = "scripts_poetry.download_model:main"
