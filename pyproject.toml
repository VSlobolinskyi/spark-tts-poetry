[project]
name = "spark-tts-poetry"
version = "0.1.0"
description = "A text-to-speech project by SparkAudio."
authors = [{name = "vitalii.slobolinskyi"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = [
    "einops==0.8.1",
    "einx==0.3.0",
    "numpy==2.2.3",
    "omegaconf==2.3.0",
    "packaging==24.2",
    "safetensors==0.5.2",
    "soundfile==0.12.1",
    "soxr==0.5.0.post1",
    "torch>=2.7.1,<3.0",
    "torchaudio>=2.7.1,<3.0",
    "tqdm==4.66.5",
    "transformers>=4.51.1,<5.0",
    "gradio==5.18.0",
    "tensorrt",
    "tensorrt-llm"
]

[project.urls]
Homepage = "https://github.com/VSlobolinskyi/spark-tts-poetry"
Repository = "https://github.com/VSlobolinskyi/spark-tts-poetry"

[project.scripts]
download-model = "scripts.download_model:main"

[dependency-groups]
dev = ["pytest>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Optional: Configure uv behavior
dev-dependencies = ["pytest>=7.0"]

[tool.uv.sources]
tensorrt = { url = "https://pypi.nvidia.com/tensorrt/tensorrt-10.11.0.33.tar.gz" }
tensorrt-llm = { url = "https://pypi.nvidia.com/tensorrt-llm/tensorrt_llm-0.21.0-cp312-cp312-linux_x86_64.whl" }